<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #121214;
      --bg-subtle: #1a1a1e;
      --fg: #f4f4f5;
      --fg-muted: #a1a1aa;
      --fg-subtle: #71717a;
      --border: color-mix(in oklab, var(--fg) 10%, transparent);
      --border-strong: color-mix(in oklab, var(--fg) 18%, transparent);
      --accent: #3b9eff;
      --accent-fg: #061018;
      --success: #3dd68c;
      --danger: #ff6b7d;
      --warn: #e7b549;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --font-display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
      --motion-quick: 150ms;
      --motion-fast: 250ms;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    button:disabled { cursor: default; opacity: .45; }
    img { max-width: 100%; display: block; }
    #app { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + var(--safe-t)) 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 32px; height: 32px; border-radius: 10px; object-fit: cover; }
    .brand .name { font-family: var(--font-display); font-weight: 600; letter-spacing: -.03em; font-size: 17px; }
    .brand .sub { color: var(--fg-subtle); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .avatar {
      width: 34px; height: 34px; border-radius: 11px;
      background: var(--bg-subtle); border: 1px solid var(--border);
      display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--fg-muted);
    }
    .content { flex: 1; overflow: auto; padding: 16px 16px calc(92px + var(--safe-b)); }
    .hero {
      position: relative; height: 168px; border-radius: 24px; overflow: hidden;
      background: #111 url("/assets/welcome.jpg") center/cover no-repeat; margin-bottom: 16px;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,11,.15), rgba(10,10,11,.78));
    }
    .hero .txt { position: absolute; inset: auto 16px 14px 16px; z-index: 1; }
    .hero h1 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: -.03em; font-weight: 600; line-height: 1.1; }
    .hero p { margin: 6px 0 0; color: color-mix(in oklab, var(--fg) 82%, transparent); font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 10px; text-align: center;
    }
    .stat b { display: block; font-family: var(--font-display); font-size: 16px; letter-spacing: -.02em; }
    .stat span { color: var(--fg-subtle); font-size: 11px; }
    h2.sec { margin: 8px 0 12px; font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--fg);
      border-radius: 12px; min-height: 48px; padding: 12px 14px; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
      transition: transform var(--motion-quick) var(--ease), background var(--motion-quick) var(--ease);
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--fg); color: var(--bg); border-color: transparent; grid-column: 1 / -1; min-height: 52px; border-radius: 16px; }
    .btn.ghost { background: transparent; }
    .btn.accent { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    .btn.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); }
    .btn.wide { grid-column: 1 / -1; }
    .card {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
      padding: 16px; margin-bottom: 10px;
    }
    .card h3 { margin: 0 0 4px; font-size: 15px; font-family: var(--font-display); letter-spacing: -.02em; }
    .muted { color: var(--fg-muted); font-size: 13px; }
    .subtle { color: var(--fg-subtle); font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
      padding: 4px 8px; font-size: 11px; font-weight: 600; background: var(--bg-subtle); color: var(--fg-muted);
    }
    .pill.buy { color: var(--success); background: color-mix(in oklab, var(--success) 12%, transparent); }
    .pill.sell { color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); }
    .pill.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 14%, transparent); }
    .pill.ok { color: var(--success); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .ad {
      display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
    }
    .ad .ava {
      width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
      background: var(--bg-subtle); font-weight: 700; font-size: 13px; color: var(--fg);
    }
    .ad .who { font-weight: 600; font-size: 14px; }
    .price { font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--font-display); }
    .tabs {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-b));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px;
      padding: 6px; z-index: 20;
    }
    .tabs button {
      appearance: none; border: 0; background: transparent; color: var(--fg-subtle);
      border-radius: 16px; padding: 8px 4px 6px; font-size: 10px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .tabs button svg { width: 20px; height: 20px; }
    .tabs button.on { color: var(--fg); background: var(--bg-subtle); }
    .tabs .plus {
      width: 36px; height: 36px; border-radius: 13px; background: var(--fg); color: var(--bg);
      display: grid; place-items: center; margin-bottom: 2px;
    }
    .sheet {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet .panel {
      width: min(560px, 100%); background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 24px 24px 0 0; padding: 12px 16px calc(20px + var(--safe-b));
      max-height: 88dvh; overflow: auto;
    }
    .grab { width: 36px; height: 4px; border-radius: 99px; background: var(--border-strong); margin: 4px auto 12px; }
    input, textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      border-radius: 12px; padding: 12px 14px; font: 500 15px var(--font-body); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--border-strong); }
    textarea { min-height: 96px; resize: vertical; }
    label { display: block; font-size: 12px; color: var(--fg-muted); margin: 0 0 6px; font-weight: 600; }
    .field { margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      appearance: none; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px;
    }
    .chip.on { background: var(--fg); color: var(--bg); border-color: transparent; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lang-grid button { min-height: 52px; justify-content: flex-start; padding: 0 14px; gap: 10px; }
    .flag { font-size: 18px; width: 24px; text-align: center; }
    .empty { text-align: center; padding: 28px 12px; color: var(--fg-muted); }
    .stars { letter-spacing: 2px; color: var(--warn); font-variant-numeric: tabular-nums; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px; }
    .kv span { color: var(--fg-muted); }
    .toast {
      position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%);
      background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px;
      font-size: 13px; font-weight: 600; z-index: 60; opacity: 0; pointer-events: none;
      transition: opacity var(--motion-fast) var(--ease);
    }
    .toast.show { opacity: 1; }
    .gate { position: fixed; inset: 0; z-index: 50; background: var(--bg); padding: calc(28px + var(--safe-t)) 16px 24px; overflow: auto; }
    .gate h1 { font-family: var(--font-display); font-size: 28px; letter-spacing: -.03em; margin: 8px 0 6px; }
    [dir="rtl"] .content, [dir="rtl"] .top, [dir="rtl"] .panel { text-align: right; }
    .timeline { border-left: 1px solid var(--border); margin: 8px 0 0 7px; padding-left: 14px; }
    .timeline div { margin: 0 0 10px; font-size: 13px; color: var(--fg-muted); }
    .timeline b { color: var(--fg); font-weight: 600; }
    .faq { border-top: 1px solid var(--border); padding: 12px 0; }
    .faq b { display: block; margin-bottom: 4px; }
    .copy { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; background: var(--bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--border); }

    .rate-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .rate-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
    .rate-card .symbol { font-weight: 700; font-family: var(--font-display); }
    .rate-card .main-price { margin-top: 6px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rate-card .sub-prices { margin-top: 4px; color: var(--fg-subtle); font-size: 11px; line-height: 1.6; }
    .gift-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .gift-card { overflow: hidden; padding: 0; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; color: var(--fg); }
    .gift-media { aspect-ratio: 1 / 1; background: var(--bg-subtle); position: relative; overflow: hidden; }
    .gift-media img { width: 100%; height: 100%; object-fit: cover; }
    .gift-body { padding: 11px; }
    .gift-collection { color: var(--fg-subtle); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gift-name { margin-top: 4px; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gift-meta { margin-top: 6px; display: flex; justify-content: space-between; align-items: end; gap: 8px; }
    .gift-price { font-family: var(--font-display); font-weight: 700; font-size: 14px; white-space: nowrap; }
    .gift-source { color: var(--fg-subtle); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .gift-link { display: block; margin-top: 8px; color: var(--accent); font-size: 11px; text-decoration: none; }
    .nft-help { margin: -4px 0 10px; color: var(--fg-subtle); font-size: 11px; line-height: 1.45; }
    .notice { padding: 11px 12px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 12px; color: var(--fg-muted); font-size: 12px; }
    .loading { min-height: 44dvh; display: grid; place-items: center; color: var(--fg-muted); font-size: 13px; }
    .error-box { padding: 16px; background: var(--bg-elevated); border: 1px solid color-mix(in oklab, var(--danger) 30%, transparent); border-radius: 16px; }
    .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    @media (min-width: 560px) { .gift-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } .rate-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

    function persistUi() {

    function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
    function t(k, vars) {
      const d = I18N[S.lang] || I18N.en;
      let value = d[k] || I18N.en[k] || k;
      if (vars) Object.entries(vars).forEach(([a,b]) => value = value.replaceAll("{" + a + "}", String(b)));
      return value;

    function toast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }
    function escAttr(v) { return escapeHtml(String(v)).replace(/`/g, "&#96;"); }
    function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function fmt(n, max = 4) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "—";
      return x.toLocaleString("en-US", { maximumFractionDigits: max });
    }
    function money(n, currency) { return `${fmt(n, 6)} ${currency}`; }
    function statusLabel(st) {
      return ({ wait_peer:t("waitPeer"), wait_pay:t("waitPay"), wait_release:t("waitRel"), done:t("done"), dispute:t("dispute"), cancelled:t("cancelled") })[st] || st;

    function viewerRole(d) {
      return d.peerId === S.user?.id ? (d.role === "buy" ? "sell" : "buy") : d.role;

    function shareUrl(d) {
      if (S.shareUrls[d.id]) return S.shareUrls[d.id];
      if (BOT) return `https://t.me/${BOT}?start=d_${encodeURIComponent(d.id)}`;
      return `${location.origin}/?deal=${encodeURIComponent(d.id)}`;

    async function openExternal(url) {
      try {
        if (tg?.openLink) return tg.openLink(url);
        window.open(url, "_blank", "noopener,noreferrer");
      } catch { window.location.href = url; }
    }
    function go(page, extra = {}) {
      S.page = page;
      Object.assign(S, extra);
      persistUi();
      haptic();
      render();
      if (page === "deals" || page === "deal" || page === "home" || page === "market") loadBootstrap().then(render).catch(() => {});
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (tg?.initData) headers["X-Telegram-Init-Data"] = tg.initData;
      const response = await fetch(path, { ...options, headers });
      let data = {};
      try { data = await response.json(); } catch { /* no json */ }
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function loadBootstrap() {
      try {
        S.error = "";
        const data = await api("/api/bootstrap");
        S.user = data.user;
        S.deals = Array.isArray(data.deals) ? data.deals : [];
        S.rates = Array.isArray(data.rates) ? data.rates : [];
        S.gifts = Array.isArray(data.gifts) ? data.gifts.slice(0,10) : [];
        S.loading = false;
        if (!S.lang && uiSaved.lang) S.lang = uiSaved.lang;
        if (S.openId && S.deals.some(d => d.id === S.openId)) S.page = "deal";
      } catch (e) {
        S.loading = false;
        S.error = e instanceof Error ? e.message : t("loadError");
      }
      render();
    }

      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p[name] || ""}</svg>`;

        inner = `<h2 class="sec">${t("selectAsset")}</h2><div class="chips">${ASSETS.map(a => `<button class="chip ${d.asset === a ? "on" : ""}" onclick="selectAsset('${a}')">${a === "NFT" ? "🖼 NFT" : a}</button>`).join("")}</div>
          ${d.asset === "NFT" ? `<div style="height:14px"></div><div class="field"><label>${t("nftLinks")}</label><div class="nft-help">${t("nftPrompt")}</div><textarea id="nftLinks" placeholder="https://t.me/nft/example-1234\nhttps://t.me/nft/example-5678">${escapeHtml(d.nftText || "")}</textarea></div>` : ""}
          <h2 class="sec">${t("selectFiat")}</h2><div class="chips">${FIATS.map(f => `<button class="chip ${d.fiat === f ? "on" : ""}" onclick="S.draft.fiat='${f}';render()">${f}</button>`).join("")}</div>
          <div style="height:16px"></div><button class="btn primary" onclick="nextCreateStep()">${t("next")}</button>`;
      } else if (step === 3) {
        inner = `${d.asset !== "NFT" ? `<h2 class="sec">${t("amount")} · ${escapeHtml(d.asset || "")}</h2><div class="field"><input id="amt" inputmode="decimal" placeholder="1000" value="${escAttr(d.amount || "")}" /></div>` : `<div class="notice">${t("nftsCount")}: <b>${(d.nftLinks || []).length}</b></div>`}
          <h2 class="sec">${t("method")}</h2><div class="chips">${METHODS.map(([k,l]) => `<button class="chip ${d.method === k ? "on" : ""}" onclick="S.draft.method='${k}';render()">${escapeHtml(t(k)) || l}</button>`).join("")}</div>
          <div style="height:16px"></div><button class="btn primary" onclick="nextMethodStep()">${t("next")}</button>`;
      } else {
        const amount = Number(d.amount || 0);
        const fee = d.asset === "NFT" ? null : amount * Number(CONFIG.COMMISSION) / 100;
        inner = `<h2 class="sec">${t("confirm")}</h2><div class="card"><div class="kv"><span>${t("roleLabel")}</span><b>${roleLabel(d.role)}</b><span>${t("asset")}</span><b>${escapeHtml(d.asset)}/${escapeHtml(d.fiat)}</b>${d.asset === "NFT" ? `<span>${t("nftsCount")}</span><b>${d.nftLinks.length}</b>` : `<span>${t("amount")}</span><b>${money(amount,d.asset)}</b><span>${t("commission")}</span><b>${money(fee,d.asset)} (${CONFIG.COMMISSION}%)</b>`}<span>${t("method")}</span><b>${escapeHtml(methodTitle(d.method))}</b></div></div>${d.asset === "NFT" ? `<div class="card"><div class="muted" style="margin-bottom:8px">${t("nftLinks")}</div>${d.nftLinks.map((x,i)=>`<div class="subtle" style="margin:4px 0">${i+1}. ${escapeHtml(x)}</div>`).join("")}</div>` : ""}<button class="btn primary" onclick="commitDeal()">${t("confirm")}</button><div style="height:8px"></div><button class="btn ghost" onclick="S.draft.step=3;render()">${t("back")}</button>`;
      }
      return `<button class="btn ghost" onclick="backCreate()">${t("back")}</button><div style="height:8px"></div>${inner}`;
    }

    function chooseRole(role) { S.draft = { step: 2, role }; render(); }
    function selectAsset(asset) { S.draft.asset = asset; if (asset !== "NFT") { delete S.draft.nftText; delete S.draft.nftLinks; } render(); }
    function normalizeNftClient(value) { const v = value.trim(); if (/^https?:\/\/t\.me\/nft\/[A-Za-z0-9_-]+$/i.test(v)) return v; if (/^t\.me\/nft\/[A-Za-z0-9_-]+$/i.test(v)) return `https://${v}`; return null; }
    function captureNftLinks() { const value = document.getElementById("nftLinks")?.value || ""; S.draft.nftText = value; const links = value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(normalizeNftClient); if (!links.length || links.some(x=>!x)) return null; S.draft.nftLinks = [...new Set(links)]; return S.draft.nftLinks; }
    function nextCreateStep() { if (!S.draft.role || !S.draft.asset || !S.draft.fiat) { toast("—"); return; } if (S.draft.asset === "NFT" && !captureNftLinks()) { toast(t("nftInvalid")); return; } S.draft.step = 3; render(); }
    function nextMethodStep() { if (S.draft.asset !== "NFT") { const v = Number((document.getElementById("amt") || {}).value); if (!Number.isFinite(v) || v <= 0) { toast(t("invalidAmount")); return; } S.draft.amount = v; } if (!S.draft.method) S.draft.method = "bank"; S.draft.step = 4; render(); }
    function backCreate() { const step = S.draft.step || 1; if (step <= 1) return go("home"); S.draft.step = step - 1; render(); }
    function methodTitle(method) { return ({ bank:t("bank"), sbp:t("sbp"), card:t("card"), crypto:t("crypto"), methodBank:t("bank"), methodSbp:t("sbp"), methodCard:t("card"), methodCrypto:t("crypto") })[method] || method || "—"; }

    function pageDeals() {
      if (!S.deals.length) return `<h2 class="sec">${t("deals")}</h2><div class="empty">${t("empty")}</div><button class="btn primary" onclick="go('create')">${t("create")}</button>`;
      return `<h2 class="sec">${t("deals")}</h2><div class="list">${S.deals.map(d=>{ const nfts=d.asset==="NFT" ? `${d.nftLinks?.length || d.amount} NFT` : `${fmt(d.amount)} ${d.asset}`; return `<button class="card" style="width:100%;text-align:start" onclick="go('deal',{openId:'${escAttr(d.id)}'})"><div class="row"><h3>${escapeHtml(d.id)}</h3><span class="pill ${pillStatus(d.status)}">${statusLabel(d.status)}</span></div><div class="muted">${roleLabel(viewerRole(d))} · ${escapeHtml(d.asset)}/${escapeHtml(d.fiat)} · ${nfts}</div>${d.counterpartyName?`<div class="subtle" style="margin-top:6px">${t("counterparty")}: ${escapeHtml(d.counterpartyName)} · ${t("counterpartyDeals")}: ${d.counterpartyDeals ?? 0}</div>`:""}</button>`;}).join("")}</div>`;
    }

    function pageDeal() {
      const d = S.deals.find(x => x.id === S.openId);
      if (!d) return `<div class="empty">${t("empty")}</div><button class="btn" onclick="go('deals')">${t("deals")}</button>`;
      const role = viewerRole(d);
      const fee = d.asset === "NFT" ? null : Number(d.amount) * Number(CONFIG.COMMISSION) / 100;
      const share = shareUrl(d);
      const canPay = d.status === "wait_pay" && role === "buy";
      const canRelease = d.status === "wait_release" && role === "sell";
      const canDispute = ["wait_pay","wait_release"].includes(d.status);
      return `<button class="btn ghost" onclick="go('deals')">${t("back")}</button><div class="card" style="margin-top:12px"><div class="row"><h3>${escapeHtml(d.id)}</h3><span class="pill ${pillStatus(d.status)}">${statusLabel(d.status)}</span></div><div class="kv" style="margin-top:12px"><span>${t("roleLabel")}</span><b>${roleLabel(role)}</b><span>${t("asset")}</span><b>${escapeHtml(d.asset)}/${escapeHtml(d.fiat)}</b>${d.asset === "NFT" ? `<span>${t("nftsCount")}</span><b>${d.nftLinks?.length || d.amount}</b>` : `<span>${t("amount")}</span><b>${money(d.amount,d.asset)}</b><span>${t("commission")}</span><b>${money(fee,d.asset)} (${CONFIG.COMMISSION}%)</b>`}<span>${t("method")}</span><b>${escapeHtml(methodTitle(d.method))}</b>${d.counterpartyName?`<span>${t("counterparty")}</span><b>${escapeHtml(d.counterpartyName)}</b><span>${t("counterpartyDeals")}</span><b>${d.counterpartyDeals ?? 0}</b>`:""}</div></div>${d.asset === "NFT" && d.nftLinks?.length ? `<div class="card"><div class="muted" style="margin-bottom:8px">${t("nftLinks")}</div>${d.nftLinks.map((x,i)=>`<div style="margin:5px 0"><a href="${escAttr(x)}" onclick="event.preventDefault();openExternal('${escAttr(x)}')">${i+1}. ${escapeHtml(x)}</a></div>`).join("")}</div>` : ""}<div class="share-actions"><button class="btn" onclick="copyText('${escAttr(share)}')">${t("copyLink")}</button><button class="btn" onclick="shareDeal('${escAttr(share)}')">${t("shareTelegram")}</button></div>${canPay?`<button class="btn primary" style="margin-top:10px" onclick="dealAction('${d.id}','paid')">${t("markPaid")}</button>`:""}${canRelease?`<button class="btn primary" style="margin-top:10px" onclick="dealAction('${d.id}','release')">${t("gotFunds")}</button>`:""}${canDispute?`<button class="btn danger wide" style="margin-top:8px" onclick="dealAction('${d.id}','dispute')">${t("openDis")}</button>`:""}${d.status !== "done" && d.status !== "cancelled" ? `<button class="btn ghost wide" style="margin-top:8px" onclick="dealAction('${d.id}','cancel')">${t("cancel")}</button>` : ""}`;
    }

    async function commitDeal() {
      const d = S.draft;
      if (d.asset === "NFT" && (!d.nftLinks || !d.nftLinks.length) && !captureNftLinks()) { toast(t("noLinks")); return; }
      const payload = { role:d.role, asset:d.asset, fiat:d.fiat, amount:d.asset === "NFT" ? d.nftLinks.length : Number(d.amount), method:d.method, nftLinks:d.asset === "NFT" ? d.nftLinks : undefined };
      try {
        toast(t("creating"));
        const data = await api("/api/deals", { method:"POST", body:JSON.stringify(payload) });
        S.shareUrls[data.deal.id] = data.shareUrl || shareUrl(data.deal);
        S.draft = {};
        S.openId = data.deal.id;
        S.page = "deal";
        await loadBootstrap();
        toast(t("created"));
      } catch (e) { toast(e instanceof Error ? e.message : t("loadError")); }
      render();
    }
    async function dealAction(id, action) {
      try { await api(`/api/deals/${encodeURIComponent(id)}/action`, { method:"POST", body:JSON.stringify({ action }) }); await loadBootstrap(); S.openId = id; S.page = "deal"; toast(action === "paid" ? t("paid") : action === "release" ? t("released") : t("created")); } catch (e) { toast(e instanceof Error ? e.message : t("invalidAction")); }
      render();
    }
    function copyText(v) { navigator.clipboard?.writeText(String(v)).then(() => toast(t("copied"))).catch(() => toast(String(v))); }
    function shareDeal(url) { const share = `https://t.me/share/url?url=${encodeURIComponent(url)}`; openExternal(share); }

    // Existing auxiliary Mini App pages remain intentionally lightweight.
    function pageKyc() { return `<h2 class="sec">${t("kyc")}</h2><div class="card"><p class="muted">${S.user?.verified === "ok" ? t("kycOk") : t("kycNone")}</p><div class="field"><label>${t("name")}</label><input id="kyc-name" /></div><div class="field"><label>${t("country")}</label><input id="kyc-country" /></div><button class="btn primary" onclick="submitKyc()">${t("kycGo")}</button></div>`; }
    function submitKyc() { toast(t("kycPend")); }
    function pageReq() { return `<h2 class="sec">${t("req")}</h2><div class="notice">${t("empty")}</div>`; }
    function pageLang() { return `<h2 class="sec">${t("lang")}</h2><div class="lang-grid">${LANGS.map(([id,name,flag])=>`<button class="btn" onclick="setLang('${id}')"><span class="flag">${flag}</span>${name}</button>`).join("")}</div>`; }
    function pageRefs() { const base = BOT ? `https://t.me/${BOT}?start=ref_${S.user?.id}` : `${location.origin}/?ref=${S.user?.id}`; return `<h2 class="sec">${t("refs")}</h2><div class="copy">${escapeHtml(base)}</div><button class="btn" style="margin-top:8px" onclick="copyText('${escAttr(base)}')">${t("copy")}</button>`; }
    function pageTicks() { return `<h2 class="sec">${t("ticks")}</h2><div class="notice">${t("empty")}</div>`; }
    function pageReviews() { return `<h2 class="sec">${t("reviews")}</h2><div class="notice">${t("empty")}</div>`; }
    function pageSupport() { return `<h2 class="sec">${t("support")}</h2><div class="card"><b>${t("online")}</b><p class="muted">@${escapeHtml(CONFIG.SUPPORT || "support")}</p></div>`; }
    function pageMore() { return `<h2 class="sec">${escapeHtml(S.user?.name || "User")}</h2><p class="muted">ID ${S.user?.id || "—"} · ${S.user?.verified === "ok" ? t("kycOk") : t("kycNone")}</p><div class="actions"><button class="btn" onclick="go('kyc')">${t("kyc")}</button><button class="btn" onclick="go('req')">${t("req")}</button><button class="btn" onclick="go('lang')">${t("lang")}</button><button class="btn" onclick="go('refs')">${t("refs")}</button><button class="btn" onclick="go('reviews')">${t("reviews")}</button><button class="btn" onclick="go('support')">${t("support")}</button></div>`; }
    function pageGate() { return `<div class="gate"><img src="/assets/photo.png" alt="" style="width:64px;height:64px;border-radius:20px" /><h1>${escapeHtml(CONFIG.SERVICE_NAME)}</h1><p class="muted">${I18N.en.lead}</p><p class="muted" style="margin-bottom:18px">${I18N.en.choose} · ${I18N.ru.choose}</p><div class="lang-grid">${LANGS.map(([id,name,flag])=>`<button class="btn" onclick="setLang('${id}')"><span class="flag">${flag}</span>${name}</button>`).join("")}</div></div>`; }
    function setLang(id) { S.lang = id; persistUi(); haptic(); render(); }
    function render() {
      const app = document.getElementById("app");
      document.documentElement.lang = S.lang || "en";
      document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
      if (S.loading && !S.user) { app.innerHTML = `<div class="loading">${t("loading") || "Loading…"}</div>`; return; }
      if (!S.lang) { app.innerHTML = pageGate(); return; }
      if (S.error && !S.user) { app.innerHTML = `<div class="gate"><div class="error-box"><b>${escapeHtml(t("loadError"))}</b><p class="muted">${escapeHtml(S.error)}</p><button class="btn primary" onclick="loadBootstrap()">${t("retry")}</button></div></div>`; return; }
      const pages = { home:pageHome, market:pageMarket, create:pageCreate, deals:pageDeals, deal:pageDeal, kyc:pageKyc, req:pageReq, lang:pageLang, refs:pageRefs, ticks:pageTicks, reviews:pageReviews, support:pageSupport, more:pageMore };
      app.innerHTML = topbar() + `<main class="content">${(pages[S.page] || pageHome)()}</main>` + tabs();
      if (tg?.BackButton) { try { tg.BackButton.offClick?.(goHome); } catch {} if (S.page !== "home") { tg.BackButton.show(); tg.BackButton.onClick(goHome); } else tg.BackButton.hide(); }
    }
    function goHome() { go("home"); }
    window.go = go; window.setLang = setLang; window.chooseRole = chooseRole; window.selectAsset = selectAsset; window.nextCreateStep = nextCreateStep; window.nextMethodStep = nextMethodStep; window.backCreate = backCreate; window.commitDeal = commitDeal; window.dealAction = dealAction; window.copyText = copyText; window.shareDeal = shareDeal; window.openExternal = openExternal; window.loadBootstrap = loadBootstrap; window.render = render;

    render();
    loadBootstrap().catch(() => {});

  </script>
</body>
</html>
