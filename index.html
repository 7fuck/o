<html lang="en">

    :root {
      --bg: #0a0a0b;
      --bg-elevated: #121214;
      --bg-subtle: #1a1a1e;
      --fg: #f4f4f5;
      --fg-muted: #a1a1aa;
      --fg-subtle: #71717a;
      --border: color-mix(in oklab, var(--fg) 10%, transparent);
      --border-strong: color-mix(in oklab, var(--fg) 18%, transparent);
      --accent: #3b9eff;
      --accent-fg: #061018;
      --success: #3dd68c;
      --danger: #ff6b7d;
      --warn: #e7b549;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --font-display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
      --motion-quick: 150ms;
      --motion-fast: 250ms;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    button:disabled { cursor: default; opacity: .45; }
    img { max-width: 100%; display: block; }
    #app { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + var(--safe-t)) 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 32px; height: 32px; border-radius: 10px; object-fit: cover; }
    .brand .name { font-family: var(--font-display); font-weight: 600; letter-spacing: -.03em; font-size: 17px; }
    .brand .sub { color: var(--fg-subtle); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .avatar {
      width: 34px; height: 34px; border-radius: 11px;
      background: var(--bg-subtle); border: 1px solid var(--border);
      display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--fg-muted);
    }
    .content { flex: 1; overflow: auto; padding: 16px 16px calc(92px + var(--safe-b)); }
    .hero {
      position: relative; height: 168px; border-radius: 24px; overflow: hidden;
      background: #111 url("./welcome.jpg") center/cover no-repeat; margin-bottom: 16px;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,11,.15), rgba(10,10,11,.78));
    }
    .hero .txt { position: absolute; inset: auto 16px 14px 16px; z-index: 1; }
    .hero h1 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: -.03em; font-weight: 600; line-height: 1.1; }
    .hero p { margin: 6px 0 0; color: color-mix(in oklab, var(--fg) 82%, transparent); font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 10px; text-align: center;
    }
    .stat b { display: block; font-family: var(--font-display); font-size: 16px; letter-spacing: -.02em; }
    .stat span { color: var(--fg-subtle); font-size: 11px; }
    h2.sec { margin: 8px 0 12px; font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--fg);
      border-radius: 12px; min-height: 48px; padding: 12px 14px; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
      transition: transform var(--motion-quick) var(--ease), background var(--motion-quick) var(--ease);
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--fg); color: var(--bg); border-color: transparent; grid-column: 1 / -1; min-height: 52px; border-radius: 16px; }
    .btn.ghost { background: transparent; }
    .btn.accent { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    .btn.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); }
    .btn.wide { grid-column: 1 / -1; }
    .card {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
      padding: 16px; margin-bottom: 10px;
    }
    .card h3 { margin: 0 0 4px; font-size: 15px; font-family: var(--font-display); letter-spacing: -.02em; }
    .muted { color: var(--fg-muted); font-size: 13px; }
    .subtle { color: var(--fg-subtle); font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
      padding: 4px 8px; font-size: 11px; font-weight: 600; background: var(--bg-subtle); color: var(--fg-muted);
    }
    .pill.buy { color: var(--success); background: color-mix(in oklab, var(--success) 12%, transparent); }
    .pill.sell { color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); }
    .pill.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 14%, transparent); }
    .pill.ok { color: var(--success); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .ad {
      display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
    }
    .ad .ava {
      width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
      background: var(--bg-subtle); font-weight: 700; font-size: 13px; color: var(--fg);
    }
    .ad .who { font-weight: 600; font-size: 14px; }
    .price { font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--font-display); }
    .tabs {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-b));
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px;
      padding: 6px; z-index: 20;
    }
    .tabs button {
      appearance: none; border: 0; background: transparent; color: var(--fg-subtle);
      border-radius: 16px; padding: 8px 4px 6px; font-size: 10px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .tabs button svg { width: 20px; height: 20px; }
    .tabs button.on { color: var(--fg); background: var(--bg-subtle); }
    .tabs .plus {
      width: 36px; height: 36px; border-radius: 13px; background: var(--fg); color: var(--bg);
      display: grid; place-items: center; margin-bottom: 2px;
    }
    .sheet {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet .panel {
      width: min(560px, 100%); background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 24px 24px 0 0; padding: 12px 16px calc(20px + var(--safe-b));
      max-height: 88dvh; overflow: auto;
    }
    .grab { width: 36px; height: 4px; border-radius: 99px; background: var(--border-strong); margin: 4px auto 12px; }
    input, textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      border-radius: 12px; padding: 12px 14px; font: 500 15px var(--font-body); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--border-strong); }
    textarea { min-height: 96px; resize: vertical; }
    label { display: block; font-size: 12px; color: var(--fg-muted); margin: 0 0 6px; font-weight: 600; }
    .field { margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      appearance: none; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px;
    }
    .chip.on { background: var(--fg); color: var(--bg); border-color: transparent; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lang-grid button { min-height: 52px; justify-content: flex-start; padding: 0 14px; gap: 10px; }
    .flag { font-size: 18px; width: 24px; text-align: center; }
    .empty { text-align: center; padding: 28px 12px; color: var(--fg-muted); }
    .stars { letter-spacing: 2px; color: var(--warn); font-variant-numeric: tabular-nums; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px; }
    .kv span { color: var(--fg-muted); }
    .toast {
      position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%);
      background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px;
      font-size: 13px; font-weight: 600; z-index: 60; opacity: 0; pointer-events: none;
      transition: opacity var(--motion-fast) var(--ease);
    }
    .toast.show { opacity: 1; }
    .gate { position: fixed; inset: 0; z-index: 50; background: var(--bg); padding: calc(28px + var(--safe-t)) 16px 24px; overflow: auto; }
    .gate h1 { font-family: var(--font-display); font-size: 28px; letter-spacing: -.03em; margin: 8px 0 6px; }
    [dir="rtl"] .content, [dir="rtl"] .top, [dir="rtl"] .panel { text-align: right; }
    .timeline { border-left: 1px solid var(--border); margin: 8px 0 0 7px; padding-left: 14px; }
    .timeline div { margin: 0 0 10px; font-size: 13px; color: var(--fg-muted); }
    .timeline b { color: var(--fg); font-weight: 600; }
    .faq { border-top: 1px solid var(--border); padding: 12px 0; }
    .faq b { display: block; margin-bottom: 4px; }
    .copy { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; background: var(--bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--border); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

        ${S.showAdd ? `<div class="card" style="margin-top:12px">
          <div class="chips" style="margin-bottom:12px">
            <button class="chip ${(S.newReq&&S.newReq.kind)==="card"?"on":""}" onclick="S.newReq={kind:'card'};render()">${t("card")}</button>
            <button class="chip ${(S.newReq&&S.newReq.kind)==="wallet"?"on":""}" onclick="S.newReq={kind:'wallet'};render()">${t("crypto")}</button>
          </div>
          <div class="field"><input id="rq1" placeholder="${(S.newReq&&S.newReq.kind)==="wallet"?t("network"):t("card")}" /></div>
          <div class="field"><input id="rq2" placeholder="${(S.newReq&&S.newReq.kind)==="wallet"?t("address"):t("holder")}" /></div>
          <button class="btn primary" onclick="saveReq()">${t("save")}</button>
        </div>` : ""}
        <div class="list" style="margin-top:12px">${S.req.length? S.req.map(r=>`<div class="card"><div class="row"><div><h3>${escapeHtml(r.label)}</h3><div class="subtle">${escapeHtml(r.detail)}</div></div>
          <button class="btn ghost" onclick="S.req=S.req.filter(x=>x.id!=='${r.id}');persist();render()">✕</button></div></div>`).join("") : `<div class="empty">${t("empty")}</div>`}</div>`;
    }

    function pageLang() {
      return `<h2 class="sec">${t("lang")}</h2>
        <div class="lang-grid">${LANGS.map(([id,name,flag]) =>
          `<button class="btn" onclick="setLang('${id}')"><span class="flag">${flag}</span>${name}${S.lang===id?" ·":""}</button>`
        ).join("")}</div>`;
    }

    function pageRefs() {
      const link = `https://t.me/share/url?url=${encodeURIComponent("https://t.me/bot?start=ref_"+S.user.id)}`;
      return `<h2 class="sec">${t("refs")}</h2>
        <p class="muted">${t("refHint",{p: CONFIG.REF_PERCENT})}</p>
        <div class="copy" id="reflink">https://t.me/bot?start=ref_${S.user.id}</div>
        <div style="height:8px"></div>
        <button class="btn" onclick="copyText(document.getElementById('reflink').textContent)">${t("copy")}</button>
        <div class="stats" style="margin-top:16px">
          <div class="stat"><b>${S.invited}</b><span>${t("invited")}</span></div>
          <div class="stat"><b>${S.earned}</b><span>${t("earned")} USDT</span></div>
          <div class="stat"><b>${CONFIG.REF_PERCENT}%</b><span>${t("fee")}</span></div>
        </div>`;
    }

    function pageTicks() {
      return `<h2 class="sec">${t("ticks")}</h2>
        <div class="field"><label>${t("subject")}</label><input id="ts" /></div>
        <div class="field"><label>${t("body")}</label><textarea id="tb"></textarea></div>
        <button class="btn primary" onclick="sendTicket()">${t("tickNew")}</button>
        <div class="list" style="margin-top:16px">${S.tickets.length? S.tickets.map(x=>`<div class="card"><div class="row"><h3>${escapeHtml(x.subject)}</h3><span class="pill">${x.id}</span></div><p class="muted">${escapeHtml(x.body)}</p></div>`).join("") : `<div class="empty">${t("empty")}</div>`}</div>`;
    }

    function pageReviews() {
      return `<h2 class="sec">${t("reviews")}</h2>
        <div class="list">${S.reviews.map(r=>`<div class="card"><div class="row"><h3>${escapeHtml(r.name)}</h3><span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p class="muted">${escapeHtml(r.text)}</p></div>`).join("")}</div>
        <div class="card">
          <div class="chips" style="margin-bottom:10px">${[5,4,3,2,1].map(n=>`<button class="chip ${S.revStar===n?"on":""}" onclick="S.revStar=${n};render()">${n}★</button>`).join("")}</div>
          <div class="field"><textarea id="rev" placeholder="${t("leave")}"></textarea></div>
          <button class="btn primary" onclick="sendRev()">${t("leave")}</button>
        </div>`;
    }

    function pageSupport() {
      return `<h2 class="sec">${t("support")}</h2>
        <div class="card"><div class="row"><b>${t("online")}</b><span class="pill ok">24/7</span></div>
          <p class="muted" style="margin:8px 0 0">@${escapeHtml(CONFIG.SUPPORT || "support")}</p>
        </div>
        <div class="faq"><b>${t("faq1")}</b><p class="muted">${t("faq1a",{c: CONFIG.COMMISSION})}</p></div>
        <div class="faq"><b>${t("faq2")}</b><p class="muted">${t("faq2a")}</p></div>
        <div class="faq"><b>${t("faq3")}</b><p class="muted">${t("faq3a")}</p></div>`;
    }

    function pageMore() {
      const items = [
        ["kyc", t("kyc")],["req", t("req")],["lang", t("lang")],["refs", t("refs")],
        ["ticks", t("ticks")],["reviews", t("reviews")],["support", t("support")]
      ];
      return `<h2 class="sec">${S.user.name}</h2>
        <p class="muted">ID ${S.user.id} · ${S.user.verified==="ok"?t("kycOk"):t("kycNone")}</p>
        <div class="actions">${items.map(([id,l])=>`<button class="btn" onclick="go('${id}')">${l}</button>`).join("")}</div>`;
    }

    function pageGate() {
      return `<div class="gate">
        <img src="./logo.jpg" alt="" style="width:64px;height:64px;border-radius:20px" />
        <h1>${escapeHtml(CONFIG.SERVICE_NAME)}</h1>
        <p class="muted">${I18N.en.lead}</p>
        <p class="muted" style="margin-bottom:18px">${I18N.en.choose} · ${I18N.ru.choose}</p>
        <div class="lang-grid">${LANGS.map(([id,name,flag]) =>
          `<button class="btn" onclick="setLang('${id}')"><span class="flag">${flag}</span>${name}</button>`
        ).join("")}</div>
      </div>`;
    }

    function setLang(id) {
      S.lang = id;
      persist();
      haptic();
      if (S.page === "lang") toast(LANGS.find(x=>x[0]===id)[1]);
      else S.page = S.page || "home";
      render();
    }
    function nextAmount() {
      const v = Number((document.getElementById("amt")||{}).value);
      if (!v || v <= 0) { toast("—"); return; }
      S.draft.amount = v;
      if (!S.draft.method) S.draft.method = "bank";
      S.draft.step = 4;
      persist(); render();
    }
    function commitDeal() {
      const d = S.draft;
      const deal = {
        id: uid("AUR"), role: d.role, asset: d.asset, fiat: d.fiat,
        amount: Number(d.amount), method: d.method, status: "wait_peer", createdAt: Date.now()
      };
      S.deals.unshift(deal);
      S.draft = {};
      S.openId = deal.id;
      S.page = "deal";
      persist();
      toast(t("created"));
      render();
    }
    function advance(id, st) {
      const d = S.deals.find(x => x.id === id);
      if (d) d.status = st;
      persist(); haptic(); render();
    }
    function submitKyc() {
      S.kyc.name = (document.getElementById("kyc-name")||{}).value || "";
      S.kyc.country = (document.getElementById("kyc-country")||{}).value || "";
      S.user.verified = "pending";
      persist();
      toast(t("kycPend"));
      setTimeout(() => { S.user.verified = "ok"; persist(); render(); toast(t("kycOk")); }, 1400);
      render();
    }
    function saveReq() {
      const a = (document.getElementById("rq1")||{}).value || "";
      const b = (document.getElementById("rq2")||{}).value || "";
      if (!a || !b) return;
      S.req.push({ id: uid("RQ"), label: a, detail: b, kind: (S.newReq&&S.newReq.kind)||"card" });
      S.showAdd = false; S.newReq = null; persist(); render();
    }
    function sendTicket() {
      const s = (document.getElementById("ts")||{}).value || "";
      const b = (document.getElementById("tb")||{}).value || "";
      if (!s || !b) return;
      S.tickets.unshift({ id: uid("TK"), subject: s, body: b });
      persist(); toast(t("sent")); render();
    }
    function sendRev() {
      const text = (document.getElementById("rev")||{}).value || "";
      if (!text) return;
      S.reviews.unshift({ id: uid("RV"), name: S.user.name, rating: S.revStar || 5, text });
      persist(); toast(t("thanks")); render();
    }
    function openAd(id) {
      const a = S.ads.find(x => x.id === id);
      if (!a) return;
      S.draft = { step: 4, role: a.side === "sell" ? "buy" : "sell", asset: a.asset, fiat: a.fiat, amount: a.min, method: "bank" };
      go("create");
    }
    function copyText(v) {
      navigator.clipboard.writeText(v).then(() => toast(t("copied"))).catch(() => toast(v));
    }
    function fmt(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return n;
      return x >= 1000 ? x.toLocaleString("en-US", { maximumFractionDigits: 2 }) : String(x);
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
    function escapeAttr(s) { return escapeHtml(s); }

    function render() {
      const app = document.getElementById("app");
      document.documentElement.lang = S.lang || "en";
      document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
      if (!S.lang) { app.innerHTML = pageGate(); return; }
      const pages = {
        home: pageHome, market: pageMarket, create: pageCreate, deals: pageDeals, deal: pageDeal,
        kyc: pageKyc, req: pageReq, lang: pageLang, refs: pageRefs, ticks: pageTicks,
        reviews: pageReviews, support: pageSupport, more: pageMore
      };
      const view = (pages[S.page] || pageHome)();
      app.innerHTML = topbar() + `<main class="content">${view}</main>` + tabs();
      if (tg && tg.BackButton) {
        if (S.page !== "home") { tg.BackButton.show(); tg.BackButton.onClick(() => go("home")); }
        else tg.BackButton.hide();
      }
    }

    window.go = go; window.setLang = setLang; window.nextAmount = nextAmount;
    window.commitDeal = commitDeal; window.advance = advance; window.submitKyc = submitKyc;
    window.saveReq = saveReq; window.sendTicket = sendTicket; window.sendRev = sendRev;
    window.openAd = openAd; window.copyText = copyText; window.S = S; window.render = render;
    window.t = t;

    render();
  </script>
</body>
</html>
